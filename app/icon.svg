<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad)"/>
  
  <!-- Simplified chat bubble -->
  <rect x="12" y="18" width="40" height="30" rx="10" fill="white" opacity="0.95"/>
  <path d="M20 48 L16 54 L24 48" fill="white" opacity="0.95"/>
  
  <!-- AI brain circuit -->
  <circle cx="32" cy="33" r="12" fill="#6366F1" opacity="0.12"/>
  <circle cx="32" cy="33" r="8" fill="none" stroke="#6366F1" strokeWidth="1.5" opacity="0.3"/>
  <circle cx="28" cy="29" r="2.5" fill="#6366F1" opacity="0.6"/>
  <circle cx="36" cy="29" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="28" cy="37" r="2.5" fill="#06B6D4" opacity="0.6"/>
  <circle cx="36" cy="37" r="2.5" fill="#6366F1" opacity="0.6"/>
  
  <!-- Message lines -->
  <rect x="26" y="21" width="12" height="2" rx="1" fill="#9CA3AF"/>
  <rect x="26" y="25" width="18" height="2" rx="1" fill="#9CA3AF"/>
  <rect x="26" y="29" width="10" height="2" rx="1" fill="#6366F1" opacity="0.4"/>
  
  <!-- Real-time dot -->
  <circle cx="50" cy="16" r="4" fill="#22C55E">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>